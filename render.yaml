services:
  - type: web
    name: qz-gateway
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://qzmotorcenterfrontend.onrender.com

      # ── Rate Limiting ──────────────────────────────────────
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 100
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: AUTH_RATE_LIMIT_MAX
        value: 10

      # ── Microservices URLs ─────────────────────────────────
      - key: AUTH_API_URL
        value: https://qzmotorcenter-api.onrender.com
      - key: CARS_API_URL
        value: https://qzmotorcenter-cars-api.onrender.com
      - key: MOTORCYCLES_API_URL
        value: https://qzmotorcenter-motorcycles-api.onrender.com
      - key: ELECTROBIKES_API_URL
        value: https://qzmotorcenter-electrobike-api.onrender.com
      - key: SCOOTERS_API_URL
        value: https://qzmotorcenter-scooter-api.onrender.com
      - key: REPORTS_API_URL
        value: https://qzmotorcenterreports-1.onrender.com
      - key: AI_API_URL
        value: https://qzmotorcenter-ai-api.onrender.com
      - key: SERVERLESS_API_URL
        value: https://qzmotorcenterserverless.vercel.app
